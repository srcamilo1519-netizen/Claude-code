# Optional centralized-logs stack: Loki (storage) + Promtail (collector) +
# Grafana (UI). Run alongside the app stack:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Grafana is bound to localhost only — reach it through an SSH tunnel:
#   ssh -L 3001:localhost:3001 user@your-server   →  http://localhost:3001

services:
  loki:
    image: grafana/loki:3.1.1
    container_name: clipresumen_loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    container_name: clipresumen_promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.4
    container_name: clipresumen_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data:
