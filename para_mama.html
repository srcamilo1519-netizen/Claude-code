<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para mi Mamita Bella 💐</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:   #f472b6;
      --rose2:  #ec4899;
      --gold:   #fbbf24;
      --cream:  #fff7ed;
      --purple: #a855f7;
      --deep:   #1e0a2e;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(ellipse at 20% 50%, #2d0a4e 0%, #0f0520 60%, #000 100%);
      font-family: 'Playfair Display', serif;
      perspective: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Particle stars ── */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--d) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.1; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.6); }
    }

    /* ── Floating petals ── */
    .petal {
      position: fixed;
      font-size: 1.4rem;
      pointer-events: none;
      z-index: 1;
      animation: fall var(--fd) linear infinite;
      opacity: 0;
      top: -60px;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg) translateX(0);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(720deg) translateX(var(--fx)); opacity: 0; }
    }

    /* ── Scene wrapper ── */
    #scene {
      position: relative;
      z-index: 10;
      transform-style: preserve-3d;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0px)    rotateX(2deg); }
      50%      { transform: translateY(-18px)  rotateX(-2deg); }
    }

    /* ── Card ── */
    .card {
      width: min(480px, 92vw);
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(244,114,182,0.2),
        0 8px 32px rgba(0,0,0,0.6),
        0 32px 80px rgba(168,85,247,0.25),
        inset 0 1px 0 rgba(255,255,255,0.25);
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }

    /* glow rim */
    .card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      background: conic-gradient(from 0deg, var(--rose), var(--gold), var(--purple), var(--rose));
      z-index: -1;
      animation: spin 4s linear infinite;
      filter: blur(6px);
      opacity: 0.7;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* inner shine line */
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    }

    /* ── Heart emoji title ── */
    .heart-row {
      font-size: 2.6rem;
      margin-bottom: 0.4rem;
      filter: drop-shadow(0 0 12px var(--rose));
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 7vw, 3rem);
      color: #fff;
      text-shadow:
        0 0 20px var(--rose),
        0 0 40px var(--rose2),
        0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 0.02em;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(251,191,36,0.9);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* ── 3D flower ── */
    .flower-stage {
      perspective: 400px;
      margin: 0 auto 1.8rem;
      width: 120px;
      height: 120px;
    }
    .flower {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: spin3d 8s linear infinite;
      position: relative;
    }
    @keyframes spin3d {
      to { transform: rotateY(360deg) rotateX(20deg); }
    }
    .petal-3d {
      position: absolute;
      width: 50px;
      height: 70px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      top: 50%; left: 50%;
      margin: -35px 0 0 -25px;
      transform-origin: center bottom;
      backface-visibility: visible;
    }
    .center-3d {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%) translateZ(10px);
      background: radial-gradient(circle at 35% 35%, #fef08a, #f59e0b);
      box-shadow: 0 0 18px #fbbf24, 0 0 6px #fff;
      z-index: 10;
    }

    /* ── Message box ── */
    .message {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(244,114,182,0.25);
      border-radius: 16px;
      padding: 1.4rem 1.6rem;
      margin-bottom: 1.8rem;
      transform: translateZ(20px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .message p {
      color: rgba(255,255,255,0.92);
      font-size: 1.05rem;
      line-height: 1.75;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .message p span {
      color: var(--gold);
      font-style: italic;
    }

    /* ── Signature ── */
    .signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: var(--rose);
      text-shadow: 0 0 16px var(--rose2);
      margin-bottom: 0.5rem;
    }

    /* ── 3D Ribbon banner ── */
    .ribbon {
      position: relative;
      background: linear-gradient(90deg, var(--rose2), var(--purple), var(--rose2));
      color: #fff;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.45rem 1.5rem;
      border-radius: 4px;
      display: inline-block;
      box-shadow:
        0 4px 0 rgba(0,0,0,0.35),
        0 8px 20px rgba(168,85,247,0.4);
      transform: translateZ(30px);
      margin-top: 0.5rem;
    }
    .ribbon::before,
    .ribbon::after {
      content: '';
      position: absolute;
      top: 100%;
      border: 8px solid transparent;
    }
    .ribbon::before { left: 0;  border-right-color: var(--rose2); border-top-color: var(--rose2); }
    .ribbon::after  { right: 0; border-left-color:  var(--purple); border-top-color: var(--purple); }

    /* ── Sparkle dots ── */
    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sp {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: sparkle var(--sd) ease-in-out infinite var(--ss);
    }
    @keyframes sparkle {
      0%,100% { opacity: 0; transform: scale(0); }
      50%      { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<!-- Background stars -->
<div id="stars"></div>

<!-- Floating petals -->
<div id="petals"></div>

<!-- Main scene -->
<div id="scene">
  <div class="card">

    <!-- Inner sparkles -->
    <div class="sparkles" id="sparkles"></div>

    <div class="heart-row">💖</div>
    <h1>Para mi Mamita</h1>
    <p class="subtitle">Con todo mi amor</p>

    <!-- 3D Flower -->
    <div class="flower-stage">
      <div class="flower" id="flower">
        <div class="center-3d"></div>
      </div>
    </div>

    <!-- Message -->
    <div class="message">
      <p>
        Eres la <span>luz más brillante</span> de mi vida,<br/>
        la fuerza que me impulsa cada día.<br/><br/>
        En cada flor veo tu sonrisa,<br/>
        en cada estrella tu mirada.<br/><br/>
        <span>Gracias por todo, mamita bella.</span><br/>
        Te amo más de lo que las palabras pueden decir.
      </p>
    </div>

    <div class="signature">Con amor infinito 💕</div>
    <div class="ribbon">Siempre en mi corazón</div>

  </div>
</div>

<script>
  /* ── Stars ── */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 160; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 0.5;
    s.style.cssText = `
      width:${size}px;height:${size}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      --d:${(Math.random()*3+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*4).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  /* ── Petals ── */
  const petalsContainer = document.getElementById('petals');
  const petalEmojis = ['🌸','🌺','🌹','💮','🌷','✿'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
    const dur = (Math.random()*8+7).toFixed(1);
    p.style.cssText = `
      left:${Math.random()*100}%;
      --fd:${dur}s;
      --fx:${(Math.random()*120-60).toFixed(0)}px;
      animation-delay:${(Math.random()*10).toFixed(1)}s;
      font-size:${(Math.random()*1+0.9).toFixed(1)}rem;
    `;
    petalsContainer.appendChild(p);
  }

  /* ── 3D Flower petals ── */
  const flower = document.getElementById('flower');
  const petalColors = [
    ['#f9a8d4','#ec4899'],
    ['#fca5a5','#ef4444'],
    ['#fdba74','#f97316'],
    ['#c4b5fd','#8b5cf6'],
    ['#6ee7b7','#10b981'],
    ['#fde68a','#f59e0b'],
    ['#a5b4fc','#6366f1'],
    ['#fbcfe8','#db2777'],
  ];
  const count = 8;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'petal-3d';
    const angle = (360 / count) * i;
    const [c1, c2] = petalColors[i % petalColors.length];
    p.style.cssText = `
      transform: rotate(${angle}deg) translateY(-38px);
      background: radial-gradient(ellipse at 50% 30%, ${c1}, ${c2});
      box-shadow: 0 0 12px ${c2}88;
      opacity: 0.92;
    `;
    flower.appendChild(p);
  }

  /* ── Sparkle dots inside card ── */
  const sparklesEl = document.getElementById('sparkles');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'sp';
    const size = Math.random() * 5 + 2;
    s.style.cssText = `
      width:${size}px;height:${size}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      --sd:${(Math.random()*2+1).toFixed(1)}s;
      --ss:${(Math.random()*3).toFixed(1)}s;
    `;
    sparklesEl.appendChild(s);
  }

  /* ── Subtle mouse parallax ── */
  document.addEventListener('mousemove', e => {
    const cx = window.innerWidth  / 2;
    const cy = window.innerHeight / 2;
    const rx = ((e.clientY - cy) / cy) * 8;
    const ry = ((e.clientX - cx) / cx) * -8;
    document.getElementById('scene').style.transform =
      `rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
  document.addEventListener('mouseleave', () => {
    document.getElementById('scene').style.transform = '';
  });
</script>
</body>
</html>
