<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#05060f" />
<title>Sistema Solar Explorador 🪐</title>
<style>
  :root {
    --panel-bg: rgba(10, 14, 30, 0.82);
    --panel-border: rgba(120, 160, 255, 0.25);
    --accent: #6db3ff;
    --text: #e8eefc;
    --muted: #98a6c8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05060f;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #scene { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #0b1430, #05060f 70%);
    gap: 18px; transition: opacity .6s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 54px; height: 54px;
    border: 4px solid rgba(109,179,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { color: var(--muted); letter-spacing: .5px; font-size: 14px; }

  /* ---------- Header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    background: linear-gradient(180deg, rgba(5,6,15,0.85), rgba(5,6,15,0));
    pointer-events: none;
  }
  header h1 {
    font-size: clamp(16px, 4vw, 24px);
    font-weight: 700;
    letter-spacing: .5px;
    text-shadow: 0 0 18px rgba(109,179,255,0.5);
  }
  header h1 span { opacity: .55; font-weight: 400; }

  /* ---------- Controls ---------- */
  #controls {
    position: fixed; z-index: 10;
    bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 8px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    max-width: calc(100% - 24px);
  }
  button.ctrl {
    appearance: none; border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    padding: 9px 14px; border-radius: 11px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: background .2s, transform .1s, border-color .2s;
    white-space: nowrap;
  }
  button.ctrl:hover { background: rgba(109,179,255,0.18); border-color: var(--accent); }
  button.ctrl:active { transform: scale(0.95); }
  button.ctrl.active { background: rgba(109,179,255,0.28); border-color: var(--accent); }

  .speed-wrap {
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px; color: var(--muted); font-size: 12px;
  }
  input[type="range"] { accent-color: var(--accent); width: 90px; cursor: pointer; }

  /* ---------- Info panel ---------- */
  #info {
    position: fixed; z-index: 20;
    top: 50%; right: 18px; transform: translateY(-50%) translateX(120%);
    width: min(320px, calc(100% - 36px));
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  #info.show { transform: translateY(-50%) translateX(0); }
  #info .swatch {
    width: 46px; height: 46px; border-radius: 50%;
    box-shadow: 0 0 24px currentColor; margin-bottom: 12px;
  }
  #info h2 { font-size: 22px; margin-bottom: 4px; }
  #info .subtitle { color: var(--accent); font-size: 13px; margin-bottom: 14px; font-weight: 600; }
  #info .desc { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 14px; }
  #info .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #info .stat {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px; padding: 8px 10px;
  }
  #info .stat .label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  #info .stat .value { font-size: 14px; font-weight: 700; margin-top: 2px; }
  #info .close {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: none; color: var(--text);
    cursor: pointer; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #info .close:hover { background: rgba(255,80,80,0.3); }

  /* ---------- Hint ---------- */
  #hint {
    position: fixed; z-index: 10; top: 64px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12.5px; text-align: center;
    background: rgba(10,14,30,0.5); padding: 6px 14px; border-radius: 20px;
    pointer-events: none; transition: opacity .5s; backdrop-filter: blur(6px);
  }
  #hint.fade { opacity: 0; }

  @media (max-width: 560px) {
    #info { top: auto; bottom: 86px; right: 50%; transform: translateX(50%) translateY(120%); }
    #info.show { transform: translateX(50%) translateY(0); }
    button.ctrl { padding: 8px 11px; font-size: 12px; }
    .speed-wrap { display: none; }
  }
</style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <p>Cargando el cosmos…</p>
  </div>

  <header>
    <h1>🪐 Sistema Solar <span>Explorador</span></h1>
  </header>

  <div id="hint">Arrastra para rotar · Rueda/pellizca para zoom · Toca un planeta</div>

  <canvas id="scene"></canvas>

  <div id="info">
    <button class="close" aria-label="Cerrar">×</button>
    <div class="swatch"></div>
    <h2></h2>
    <div class="subtitle"></div>
    <div class="desc"></div>
    <div class="stats"></div>
  </div>

  <div id="controls">
    <button class="ctrl" id="toggleOrbit">⏸️ Parar órbitas</button>
    <button class="ctrl active" id="toggleLines">🛰️ Órbitas</button>
    <button class="ctrl" id="resetView">🎯 Centrar</button>
    <div class="speed-wrap">
      <span>Velocidad</span>
      <input type="range" id="speed" min="0" max="3" step="0.1" value="1" />
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ----------------------------------------------------------------------------
// Datos de los planetas
//  - size: radio visual (no a escala real, pero proporcional entre sí)
//  - dist: distancia orbital visual desde el Sol
//  - speed: velocidad orbital relativa (Mercurio el más rápido)
//  - spin:  velocidad de rotación sobre su propio eje
// ----------------------------------------------------------------------------
const PLANETS = [
  { name: 'Mercurio', color: 0x9c8b7a, size: 0.38, dist: 9,  speed: 1.60, spin: 0.04, tilt: 0.01,
    subtitle: 'El más cercano al Sol',
    desc: 'El planeta más pequeño y veloz. Sin atmósfera real, sufre temperaturas extremas entre el día y la noche.',
    stats: { 'Distancia': '57.9M km', 'Diámetro': '4 879 km', 'Día': '59 días', 'Año': '88 días' } },

  { name: 'Venus', color: 0xe6c27a, size: 0.62, dist: 13, speed: 1.18, spin: -0.012, tilt: 0.05,
    subtitle: 'El gemelo ardiente',
    desc: 'El planeta más caliente del sistema solar por su densa atmósfera de CO₂. Gira al revés que los demás.',
    stats: { 'Distancia': '108.2M km', 'Diámetro': '12 104 km', 'Día': '243 días', 'Año': '225 días' } },

  { name: 'Tierra', color: 0x3b82c4, size: 0.66, dist: 18, speed: 1.00, spin: 0.05, tilt: 0.41,
    subtitle: 'Nuestro hogar azul',
    desc: 'El único planeta conocido con vida. Agua líquida en superficie y una atmósfera rica en oxígeno y nitrógeno.',
    stats: { 'Distancia': '149.6M km', 'Diámetro': '12 742 km', 'Día': '24 horas', 'Año': '365 días' },
    moon: { size: 0.18, dist: 1.4, speed: 2.2, color: 0xbfbfbf } },

  { name: 'Marte', color: 0xc1440e, size: 0.5, dist: 24, speed: 0.81, spin: 0.048, tilt: 0.44,
    subtitle: 'El planeta rojo',
    desc: 'Su color proviene del óxido de hierro. Alberga el volcán más alto y el cañón más grande del sistema solar.',
    stats: { 'Distancia': '227.9M km', 'Diámetro': '6 779 km', 'Día': '24.6 horas', 'Año': '687 días' } },

  { name: 'Júpiter', color: 0xd8a26b, size: 2.2, dist: 34, speed: 0.44, spin: 0.10, tilt: 0.05,
    subtitle: 'El gigante gaseoso',
    desc: 'El planeta más grande. Su Gran Mancha Roja es una tormenta que dura siglos. Tiene decenas de lunas.',
    stats: { 'Distancia': '778.5M km', 'Diámetro': '139 820 km', 'Día': '9.9 horas', 'Año': '12 años' } },

  { name: 'Saturno', color: 0xe3caa0, size: 1.9, dist: 45, speed: 0.32, spin: 0.09, tilt: 0.47,
    subtitle: 'El señor de los anillos',
    desc: 'Famoso por su espectacular sistema de anillos hechos de hielo y roca. Es el planeta menos denso.',
    stats: { 'Distancia': '1 434M km', 'Diámetro': '116 460 km', 'Día': '10.7 horas', 'Año': '29 años' },
    ring: { inner: 2.4, outer: 4.0, color: 0xcdb892 } },

  { name: 'Urano', color: 0x9fe3e0, size: 1.3, dist: 55, speed: 0.23, spin: 0.07, tilt: 1.71,
    subtitle: 'El gigante inclinado',
    desc: 'Gira prácticamente de lado. Un gigante de hielo de color azul verdoso por el metano de su atmósfera.',
    stats: { 'Distancia': '2 871M km', 'Diámetro': '50 724 km', 'Día': '17 horas', 'Año': '84 años' },
    ring: { inner: 1.7, outer: 2.2, color: 0x88c4c0 } },

  { name: 'Neptuno', color: 0x3b5bdb, size: 1.25, dist: 64, speed: 0.18, spin: 0.072, tilt: 0.49,
    subtitle: 'El gigante azul ventoso',
    desc: 'El planeta más lejano. Tiene los vientos más rápidos del sistema solar, superando los 2 000 km/h.',
    stats: { 'Distancia': '4 495M km', 'Diámetro': '49 244 km', 'Día': '16 horas', 'Año': '165 años' } },
];

// ----------------------------------------------------------------------------
// Setup básico de Three.js
// ----------------------------------------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // limita DPR para rendimiento en móvil
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
const DEFAULT_CAM = new THREE.Vector3(0, 38, 78);
camera.position.copy(DEFAULT_CAM);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 320;
controls.maxPolarAngle = Math.PI * 0.92;

// ----------------------------------------------------------------------------
// Texturas procedurales (canvas) — sin descargas externas, rápidas y ligeras
// ----------------------------------------------------------------------------
function makePlanetTexture(baseColor, roughness = 0.5, bands = false) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(baseColor);
  ctx.fillStyle = `#${col.getHexString()}`;
  ctx.fillRect(0, 0, c.width, c.height);

  // moteado/manchas para dar textura
  const blobs = bands ? 0 : 220;
  for (let i = 0; i < blobs; i++) {
    const x = Math.random() * c.width;
    const y = Math.random() * c.height;
    const r = Math.random() * 8 + 1;
    const shade = (Math.random() - 0.5) * roughness;
    const cc = col.clone().offsetHSL(0, 0, shade);
    ctx.fillStyle = `rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},0.5)`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // bandas horizontales para gigantes gaseosos
  if (bands) {
    for (let y = 0; y < c.height; y += 3) {
      const shade = (Math.random() - 0.5) * 0.28;
      const cc = col.clone().offsetHSL(0, 0, shade);
      ctx.fillStyle = `rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},0.55)`;
      ctx.fillRect(0, y, c.width, 3);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeStarfield(count = 1800, radius = 700) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colArr = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    // distribución esférica
    const r = radius * (0.6 + Math.random() * 0.4);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const tint = 0.7 + Math.random() * 0.3;
    colArr[i*3] = tint; colArr[i*3+1] = tint; colArr[i*3+2] = 1;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
  const mat = new THREE.PointsMaterial({ size: 1.4, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}
scene.add(makeStarfield());

// ----------------------------------------------------------------------------
// El Sol + luz
// ----------------------------------------------------------------------------
const sunGroup = new THREE.Group();
const sunGeo = new THREE.SphereGeometry(4.2, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ map: makePlanetTexture(0xffb020, 0.4), color: 0xffaa33 });
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.userData.info = {
  name: 'Sol', color: 0xffaa33, subtitle: 'La estrella central',
  desc: 'Una estrella de tipo G que contiene el 99.8% de la masa del sistema solar. Su energía hace posible la vida en la Tierra.',
  stats: { 'Diámetro': '1.39M km', 'Temp. núcleo': '15M °C', 'Edad': '4 600M años', 'Composición': 'H + He' }
};
sunGroup.add(sun);

// Halo / glow del Sol mediante sprite
const glowCanvas = document.createElement('canvas');
glowCanvas.width = glowCanvas.height = 128;
const gctx = glowCanvas.getContext('2d');
const grad = gctx.createRadialGradient(64, 64, 6, 64, 64, 64);
grad.addColorStop(0, 'rgba(255,210,120,0.9)');
grad.addColorStop(0.3, 'rgba(255,160,40,0.5)');
grad.addColorStop(1, 'rgba(255,120,0,0)');
gctx.fillStyle = grad; gctx.fillRect(0, 0, 128, 128);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const glow = new THREE.Sprite(glowMat);
glow.scale.set(20, 20, 1);
sunGroup.add(glow);
scene.add(sunGroup);

// Luz puntual emanando del Sol + algo de ambiente para que el lado oscuro no sea negro total
const sunLight = new THREE.PointLight(0xfff2dd, 4.2, 0, 0.6);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223047, 0.6));

// ----------------------------------------------------------------------------
// Construcción de planetas, órbitas, anillos y lunas
// ----------------------------------------------------------------------------
const planetMeshes = []; // para raycasting
const orbitLines = [];

function makeOrbitLine(dist) {
  const segments = 128;
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.35 });
  return new THREE.Line(geo, mat);
}

PLANETS.forEach((p) => {
  // órbita visual
  const orbit = makeOrbitLine(p.dist);
  orbitLines.push(orbit);
  scene.add(orbit);

  // pivote que rota alrededor del Sol
  const pivot = new THREE.Group();
  scene.add(pivot);

  const isGiant = p.size > 1;
  const tex = makePlanetTexture(p.color, isGiant ? 0.3 : 0.55, isGiant);
  const geo = new THREE.SphereGeometry(p.size, 40, 40);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.05 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.x = p.dist;
  mesh.rotation.z = p.tilt; // inclinación axial
  mesh.userData.info = {
    name: p.name, color: p.color, subtitle: p.subtitle, desc: p.desc, stats: p.stats
  };
  pivot.add(mesh);
  planetMeshes.push(mesh);

  // anillos (Saturno, Urano)
  if (p.ring) {
    const rGeo = new THREE.RingGeometry(p.ring.inner, p.ring.outer, 64);
    // ajustar UVs no necesario; usamos color plano translúcido
    const rMat = new THREE.MeshBasicMaterial({ color: p.ring.color, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = Math.PI / 2 - 0.35;
    mesh.add(ring);
  }

  // luna (Tierra)
  let moonPivot = null;
  if (p.moon) {
    moonPivot = new THREE.Group();
    mesh.add(moonPivot);
    const mGeo = new THREE.SphereGeometry(p.moon.size, 20, 20);
    const mMat = new THREE.MeshStandardMaterial({ map: makePlanetTexture(p.moon.color, 0.5), roughness: 1 });
    const moon = new THREE.Mesh(mGeo, mMat);
    moon.position.x = p.moon.dist;
    moonPivot.add(moon);
    p._moonPivot = moonPivot;
    p._moonSpeed = p.moon.speed;
  }

  p._pivot = pivot;
  p._mesh = mesh;
  p._angle = Math.random() * Math.PI * 2; // posición inicial aleatoria
});

// ----------------------------------------------------------------------------
// Interacción: raycasting para clic/tap en planetas
// ----------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const clickable = [sun, ...planetMeshes];

let pointerDownPos = null;
function onPointerDown(e) {
  const t = e.touches ? e.touches[0] : e;
  pointerDownPos = { x: t.clientX, y: t.clientY };
}
function onPointerUp(e) {
  if (!pointerDownPos) return;
  const t = e.changedTouches ? e.changedTouches[0] : e;
  const dx = t.clientX - pointerDownPos.x;
  const dy = t.clientY - pointerDownPos.y;
  // si fue un arrastre (rotar la cámara), no contar como clic
  if (Math.hypot(dx, dy) > 6) { pointerDownPos = null; return; }

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((t.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((t.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickable, false);
  if (hits.length) showInfo(hits[0].object.userData.info, hits[0].object);
  pointerDownPos = null;
}
renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointerup', onPointerUp);

// ----------------------------------------------------------------------------
// Panel de información
// ----------------------------------------------------------------------------
const infoEl = document.getElementById('info');
const hintEl = document.getElementById('hint');
let focusTarget = null;

function showInfo(info, obj) {
  if (!info) return;
  const hex = '#' + new THREE.Color(info.color).getHexString();
  infoEl.querySelector('.swatch').style.background = hex;
  infoEl.querySelector('.swatch').style.color = hex;
  infoEl.querySelector('h2').textContent = info.name;
  infoEl.querySelector('.subtitle').textContent = info.subtitle;
  infoEl.querySelector('.desc').textContent = info.desc;
  const statsEl = infoEl.querySelector('.stats');
  statsEl.innerHTML = '';
  for (const [label, value] of Object.entries(info.stats)) {
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    statsEl.appendChild(div);
  }
  infoEl.classList.add('show');
  focusTarget = obj;
  hintEl.classList.add('fade');
}
infoEl.querySelector('.close').addEventListener('click', () => {
  infoEl.classList.remove('show');
  focusTarget = null;
});

// ----------------------------------------------------------------------------
// Controles de la UI
// ----------------------------------------------------------------------------
let running = true;
let speedMul = 1;
let showLines = true;

const btnOrbit = document.getElementById('toggleOrbit');
btnOrbit.addEventListener('click', () => {
  running = !running;
  btnOrbit.textContent = running ? '⏸️ Parar órbitas' : '▶️ Reanudar';
  btnOrbit.classList.toggle('active', !running);
});

const btnLines = document.getElementById('toggleLines');
btnLines.classList.add('active');
btnLines.addEventListener('click', () => {
  showLines = !showLines;
  orbitLines.forEach(l => l.visible = showLines);
  btnLines.classList.toggle('active', showLines);
});

document.getElementById('resetView').addEventListener('click', () => {
  focusTarget = null;
  infoEl.classList.remove('show');
  animateCamTo(DEFAULT_CAM, new THREE.Vector3(0, 0, 0));
});

document.getElementById('speed').addEventListener('input', (e) => {
  speedMul = parseFloat(e.target.value);
});

// pequeña animación suave de cámara al centrar
let camAnim = null;
function animateCamTo(posTarget, lookTarget) {
  camAnim = { from: camera.position.clone(), to: posTarget.clone(),
              fromT: controls.target.clone(), toT: lookTarget.clone(), t: 0 };
}

// ----------------------------------------------------------------------------
// Bucle de animación
// ----------------------------------------------------------------------------
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // limita saltos si la pestaña estuvo inactiva

  // Sol rota y palpita levemente
  sun.rotation.y += dt * 0.05;
  const pulse = 1 + Math.sin(clock.elapsedTime * 1.5) * 0.03;
  glow.scale.set(20 * pulse, 20 * pulse, 1);

  PLANETS.forEach((p) => {
    if (running) {
      p._angle += dt * p.speed * 0.25 * speedMul;
      p._pivot.rotation.y = p._angle;
    }
    // rotación sobre su eje (independiente de pausa de órbita para que se vea vivo)
    p._mesh.rotation.y += dt * p.spin * (running ? speedMul : 0.4);
    if (p._moonPivot && running) p._moonPivot.rotation.y += dt * p._moonSpeed * speedMul;
  });

  // seguir al planeta seleccionado con el target de la cámara
  if (focusTarget && focusTarget !== sun) {
    focusTarget.getWorldPosition(tmpVec);
    controls.target.lerp(tmpVec, 0.08);
  }

  // animación de cámara (botón centrar)
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 1.6);
    const e = 1 - Math.pow(1 - camAnim.t, 3); // easeOutCubic
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if (camAnim.t >= 1) camAnim = null;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ----------------------------------------------------------------------------
// Resize responsivo
// ----------------------------------------------------------------------------
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);

// ----------------------------------------------------------------------------
// Arranque
// ----------------------------------------------------------------------------
animate();
setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500);
setTimeout(() => hintEl.classList.add('fade'), 6000);
</script>
</body>
</html>
